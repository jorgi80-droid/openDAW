name: NovaDAW UI regression tests
concurrency:
  group: novadaw-ui-regression-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [novadaw-from-zero]
  pull_request:
    branches: [novadaw-from-zero]
  workflow_dispatch:

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify workspace visibility and route interactions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('app-shell/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Inline application script not found');
          const checks = [
            ['all five screens have explicit hidden styles', (html.match(/\.screen\[hidden\]\{display:none!important\}/g)||[]).length >= 1],
            ['timeline hidden rule has priority', html.includes('#timelineScreen[hidden]{display:none!important}')],
            ['screen route updates hidden and aria-hidden state', html.includes('el.hidden=!active') && html.includes("el.setAttribute('aria-hidden',active?'false':'true')")],
            ['landscape orientation is declared', fs.readFileSync('android-wrapper-novadaw/app/src/main/AndroidManifest.xml','utf8').includes('android:screenOrientation="landscape"')],
            ['immersive system UI configured', fs.readFileSync('android-wrapper-novadaw/app/src/main/java/com/novadaw/mobile/MainActivity.java','utf8').includes('SYSTEM_UI_FLAG_IMMERSIVE_STICKY')],
            ['timeline gets shrinkable workspace row', html.includes('flex:1 1 0;height:auto;min-height:0')],
            ['Playlist zoom uses stable pixel-based timeline geometry', html.includes('function applyTimelineGeometry(options={})') && html.includes('function timelineContentWidth(){return Math.max(timelineBaseWidth(),Math.ceil(timelineContentBars()*timelinePixelsPerBar()))}')],
            ['pinch zoom no longer rebuilds clip DOM every move', !html.slice(html.indexOf('function setTimelineZoom(next,anchorX){'),html.indexOf("\n$('timelineScreen').addEventListener('wheel'")).includes('renderTracks();')],
            ['ruler and lanes share direct pixel scroll offsets', html.includes('const next=Math.max(0,Math.min(content-el.clientWidth,offset))')],
            ['ruler and lane scroll stays synchronized across clip rerenders', html.includes('const savedScrollLeft=rulerViewport?.scrollLeft||0') && html.includes("area.addEventListener('scroll',e=>syncTimelineScroll(e.currentTarget)") && html.includes('syncTimelineScroll(rulerViewport)')],
            ['single Pointer Events pipeline prevents browser-default gesture during move', html.includes("document.addEventListener('pointermove',e=>") && html.includes("{capture:true,passive:false}")],
            ['two-pointer pinch has fallback and pointer cleanup', html.includes('const timelinePointers=new Map();') && html.includes("document.addEventListener('pointercancel',endTimelinePointer")],
            ['vertical drag scrolls the track list without hijacking horizontal pan', html.includes("pan.axis='y'") && html.includes('pan.trackScroller.scrollTop=Math.max(0,pan.startScrollY-dy)')],
            ['cancelled clip gestures roll back model changes before pinch or pointer cancellation', html.includes('function cancelClipGesture(pointerId)') && html.includes('cancelClipGesture(e.pointerId)') && html.includes('cancelClipGesture();')],
            ['cancelled time-range selection restores the previous selection', html.includes('function cancelRangeSelection(event)') && html.includes("addEventListener('pointercancel',cancelRangeSelection)") && html.includes('previous:timeSelection?{...timeSelection}:null')],
            ['browser list has independent scrolling', html.includes('#browserScreen .categories,#browserScreen .samplelist{min-height:0;overflow:auto')],
            ['three floating controls replace visible five-item dock', html.includes('id="floatingEditorButton"') && html.includes('id="floatingWorkspaceButton"') && html.includes('id="floatingBrowserButton"') && html.includes('id="floatingEditorMenu"')],
            ['legacy tool rail is hidden from the workspace', /<aside class="timeline-tool-rail" id="timelineTools"[^>]*hidden/.test(html)],
            ['add-track is a floating action above the timeline', html.includes('#timelineScreen>.addtrack{position:fixed!important')],
            ['micro-grid third subdivision was removed', !html.includes("(ppb/4)+'px 100%'" )],
            ['zoom requests are coalesced into animation frames', html.includes('function setTimelineZoomSmooth')],
            ['ruler and grid share a single 32-bar base scale', html.includes('const INITIAL_TIMELINE_BARS=32;') && html.includes('function timelinePixelsPerBar()') && html.includes('function timelineContentBars()')],
            ['Playlist timeline can grow past the first 32 bars', html.includes('const MAX_BARS=512;') && html.includes('Math.ceil(Math.max(0,Number(clip.start)||0)+Math.max(.25,Number(clip.duration)||.25)+32)')],
            ['clipboard paste no longer clamps clips at bar 33', !html.includes('if(pasted.start+pasted.duration>32)') && !html.includes('Math.min(32-pasted.duration,start)')],
            ['clip drag includes vertical targeting and preserves original track', html.includes('originTrackIndex:trackIndex') && html.includes('targetTrackIndex:trackIndex') && html.includes('function canMoveClipToTrack')],
            ['incompatible Audio and MIDI clip drops are rejected', html.includes('return kind===target') && html.includes('Jenis track harus sama')],
            ['clip drag supports continuous edge auto-scroll', html.includes('function runClipAutoScroll()') && html.includes('startScrollLeft') && html.includes('applyActiveClipGestureFrame()')],
            ['timeline pan decelerates naturally after touch release', html.includes('function startTimelinePanInertia(pan)') && html.includes('Math.exp(-dt/185)') && html.includes("e.type==='pointerup'")],
            ['project actions are in menu and undo/redo are not duplicated', html.includes('id="projectMenuButton"') && html.includes('id="projectMenuOverlay"') && html.includes("projectSave") && html.includes("projectExport") && !html.includes('id="save"') && !html.includes('id="open"') && !html.includes('id="export"') && !html.includes('projectMenuUndo') && !html.includes('projectMenuRedo')],
            ['ruler end marker does not overlap bar labels', html.includes('#timelineScreen .bars span.ruler-end{display:none!important}')],
            ['pixel ruler paints only every fourth bar from shared ppb scale', html.includes('function paintTimelineRuler(force=false)') && html.includes('if(bar%labelEvery!==0||bar>=MAX_BARS)continue;') && html.includes('const labelEvery=ppb<7?16:ppb<13?8:4')],
            ['pinch preview transforms only ruler and lane canvases, not labels or whole workspace', html.includes("gridElements=[ruler.querySelector('.timeline-ruler-grid-canvas'),...document.querySelectorAll('#timelineScreen .clip-canvas')]") && html.includes("canvas.style.transform='translate3d('+translate+'px,0,0) scaleX('+scale+')'") && !html.includes("ruler.querySelector('.bars').style.transform") && html.includes('timeline-ruler-label-canvas')],
            ['pinch preview commits focal bar using starting ppb and stable anchor', html.includes('startPpb:timelinePixelsPerBar()') && html.includes('const focusBar=base.anchorBar') && html.includes('focusBar*timelinePixelsPerBar()-center') && html.includes('const TIMELINE_MAJOR_BARS=4;')],
            ['zoom preview does not perform canvas paint or layout rebuild on every pinch frame', html.includes('base.pendingZoom=zoom;') && html.includes('base.pendingCenterX=pending.centerX;') && html.includes('function queueTimelinePinch(distance,centerX){') && !html.slice(html.indexOf('function queueTimelinePinch(distance,centerX){'),html.indexOf('function clearTimelinePinch(){')).includes('applyTimelineGeometry(')],
            ['piano roll uses grid and velocity layout', html.includes('id="pianogrid"') && html.includes('id="velocity"')],
          ];
          for (const [name, pass] of checks) console.log((pass?'PASS':'FAIL')+' '+name);
          if (checks.some(([,pass])=>!pass)) process.exit(1);
          // Syntax-only validation of the actual inline code. Do not execute DOM code here.
          new vm.Script(script[1], {filename:'novadaw-inline.js'});
          console.log('PASS inline JavaScript syntax');
          JS
