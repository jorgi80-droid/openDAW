name: NovaDAW UI regression tests
concurrency:
  group: novadaw-ui-regression-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [novadaw-from-zero]
  pull_request:
    branches: [novadaw-from-zero]
  workflow_dispatch:

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify workspace visibility and route interactions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('app-shell/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Inline application script not found');
          const checks = [
            ['all five screens have explicit hidden styles', (html.match(/\.screen\[hidden\]\{display:none!important\}/g)||[]).length >= 1],
            ['timeline hidden rule has priority', html.includes('#timelineScreen[hidden]{display:none!important}')],
            ['screen route updates hidden and aria-hidden state', html.includes('el.hidden=!active') && html.includes("el.setAttribute('aria-hidden',active?'false':'true')")],
            ['landscape orientation is declared', fs.readFileSync('android-wrapper-novadaw/app/src/main/AndroidManifest.xml','utf8').includes('android:screenOrientation="landscape"')],
            ['immersive system UI configured', fs.readFileSync('android-wrapper-novadaw/app/src/main/java/com/novadaw/mobile/MainActivity.java','utf8').includes('SYSTEM_UI_FLAG_IMMERSIVE_STICKY')],
            ['timeline gets shrinkable workspace row', html.includes('flex:1 1 0;height:auto;min-height:0')],
            ['Playlist zoom uses stable pixel-based timeline geometry', html.includes('function applyTimelineGeometry()') && html.includes("style.setProperty('width',contentWidth+'px','important')")],
            ['pinch zoom no longer rebuilds clip DOM every move', !html.slice(html.indexOf('function setTimelineZoom(next,anchorX){'),html.indexOf("\n$('timelineScreen').addEventListener('wheel'")).includes('renderTracks();')],
            ['ruler and lanes share direct pixel scroll offsets', html.includes('const next=Math.max(0,Math.min(content-el.clientWidth,offset))')],
            ['single Pointer Events pipeline prevents browser-default gesture during move', html.includes("document.addEventListener('pointermove',e=>") && html.includes("{capture:true,passive:false}")],
            ['two-pointer pinch has fallback and pointer cleanup', html.includes('const timelinePointers=new Map();') && html.includes("document.addEventListener('pointercancel',endTimelinePointer")],
            ['vertical drag scrolls the track list without hijacking horizontal pan', html.includes("timelinePan.axis='y'") && html.includes('timelinePan.trackScroller.scrollTop=Math.max(0,timelinePan.startScrollY-dy)')],
            ['cancelled clip gestures roll back model changes before pinch or pointer cancellation', html.includes('function cancelClipGesture(pointerId)') && html.includes('cancelClipGesture(e.pointerId)') && html.includes('cancelClipGesture();')],
            ['browser list has independent scrolling', html.includes('#browserScreen .categories,#browserScreen .samplelist{min-height:0;overflow:auto')],
            ['piano roll uses grid and velocity layout', html.includes('id="pianogrid"') && html.includes('id="velocity"')],
          ];
          for (const [name, pass] of checks) console.log((pass?'PASS':'FAIL')+' '+name);
          if (checks.some(([,pass])=>!pass)) process.exit(1);
          // Syntax-only validation of the actual inline code. Do not execute DOM code here.
          new vm.Script(script[1], {filename:'novadaw-inline.js'});
          console.log('PASS inline JavaScript syntax');
          JS
