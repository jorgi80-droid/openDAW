name: StudioWave APK build

on:
  workflow_dispatch:
  push:
    branches:
      - novadaw-from-zero

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package StudioWave UI assets
        run: |
          set -euo pipefail
          ASSETS=android-wrapper-novadaw/app/src/main/assets/novadaw
          mkdir -p "$ASSETS/assets/opendaw/fonts" "$ASSETS/assets/opendaw/ui" "$ASSETS/assets/melvox/samples/piano"
          cp app-shell/index.html "$ASSETS/index.html"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/favicon.svg -o "$ASSETS/assets/opendaw/favicon.svg"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/fonts/rubik-400.woff2 -o "$ASSETS/assets/opendaw/fonts/rubik-400.woff2"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/fonts/rubik-300.woff2 -o "$ASSETS/assets/opendaw/fonts/rubik-300.woff2"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/empty.svg -o "$ASSETS/assets/opendaw/ui/empty.svg"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/favicon-live.svg -o "$ASSETS/assets/opendaw/ui/favicon-live.svg"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/grid16.svg -o "$ASSETS/assets/opendaw/ui/grid16.svg"
          unzip -o Melvox.zip 'Melvox/public/samples/piano/*.mp3' 'Melvox/public/samples/piano/LICENSE.txt' -d /tmp/melvox-assets
          cp /tmp/melvox-assets/Melvox/public/samples/piano/*.mp3 "$ASSETS/assets/melvox/samples/piano/"
          cp /tmp/melvox-assets/Melvox/public/samples/piano/LICENSE.txt "$ASSETS/assets/melvox/samples/piano/LICENSE.txt"

      - name: Build debug APK
        working-directory: android-wrapper-novadaw
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studiowave-mobile-debug-apk
          path: android-wrapper-novadaw/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
