name: NovaDAW UI prototype check
concurrency:
  group: novadaw-ui-check-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [novadaw-from-zero]
  pull_request:
    branches: [novadaw-from-zero]
  workflow_dispatch:

jobs:
  check-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure and required screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app-shell/index.html")
          s = p.read_text()
          required = [
            'id="timelineScreen"', 'id="mixerScreen"', 'id="pianoScreen"',
            'id="devicesScreen"', 'id="browserScreen"', 'id="play"',
            'id="projectSave"', 'id="projectExport"', 'id="projectMenuButton"', 'id="projectMenuOverlay"', 'id="file"', 'data-screen="timeline"',
            'env(safe-area-inset-bottom)', 'function switchScreen',
            'id="floatingEditorButton"', 'id="floatingWorkspaceButton"', 'id="floatingBrowserButton"',
            'id="floatingEditorMenu"', 'id="floatingWorkspaceMenu"',
            '#timelineScreen>.addtrack{position:fixed!important',
            'function setTimelineZoomSmooth'
          ]
          missing = [x for x in required if x not in s]
          if missing:
            raise SystemExit("Missing required UI contracts: " + ", ".join(missing))
          # Structural checks for balanced script/style and screen IDs.
          if s.count("<script>") != 1 or s.count("</script>") != 1:
            raise SystemExit("Expected exactly one inline script block")
          if s.count("<style>") < 1 or s.count("</style>") != s.count("<style>"):
            raise SystemExit("Unbalanced style blocks")
          if 'screenOrientation="landscape"' not in Path("android-wrapper-novadaw/app/src/main/AndroidManifest.xml").read_text():
            raise SystemExit("Android wrapper must be landscape")
          if "SCREEN_ORIENTATION_SENSOR_LANDSCAPE" not in Path("android-wrapper-novadaw/app/src/main/java/com/novadaw/mobile/MainActivity.java").read_text():
            raise SystemExit("Activity must enforce landscape orientation")
          if "assets/opendaw/fonts/rubik-400.woff2" not in s:
            raise SystemExit("OpenDAW Rubik font asset link missing")
          if "#timelineScreen[hidden]{display:none!important}" not in s:
            raise SystemExit("Timeline must respect hidden state or other tabs remain covered")
          if ".screen[hidden]{display:none!important}" not in s:
            raise SystemExit("All hidden workspace screens must be removed from layout")
          activity = Path("android-wrapper-novadaw/app/src/main/java/com/novadaw/mobile/MainActivity.java").read_text()
          for flag in ["SYSTEM_UI_FLAG_FULLSCREEN", "SYSTEM_UI_FLAG_HIDE_NAVIGATION", "SYSTEM_UI_FLAG_IMMERSIVE_STICKY", "onWindowFocusChanged"]:
            if flag not in activity:
              raise SystemExit("Immersive mode missing " + flag)
          if "flex:1 1 0;height:auto;min-height:0" not in s:
            raise SystemExit("Timeline must shrink inside the workspace instead of clipping")
          if 'id="save"' in s or 'id="open"' in s or 'id="export"' in s:
            raise SystemExit("Legacy Save/Open/Export buttons must stay out of the main toolbar")
          if '#mainToolbar .subbar #save,#mainToolbar .subbar #open,#mainToolbar .subbar #export{display:none!important}' not in s:
            raise SystemExit("Project actions must be hidden from the toolbar")
          if "function saveProject()" not in s or "function openProject()" not in s or "function exportProject()" not in s:
            raise SystemExit("Project menu actions are not wired to shared project handlers")
                    print("NovaDAW UI static checks passed.")
          PY
