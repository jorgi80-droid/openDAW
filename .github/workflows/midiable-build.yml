name: MidiAble Remote Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/midiable-build.yml"
      - "packages/app/studio/src/main.ts"
      - "packages/app/studio/src/midiable-mobile.sass"
      - "android-wrapper/**"

permissions:
  contents: read

jobs:
  build-web-studio:
    name: Build studio and WASM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust nightly with WASM target and source
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build-wasm

      - name: Build studio and internal workspace dependencies
        env:
          CI: "false"
        run: npx turbo run build --filter=@opendaw/app-studio... --output-logs=full

      - name: Verify studio output
        run: test -f packages/app/studio/dist/index.html

      - name: Upload studio distribution
        uses: actions/upload-artifact@v4
        with:
          name: MidiAble-studio-web
          path: packages/app/studio/dist/
          if-no-files-found: error
          retention-days: 7

  build-android-apk:
    name: Package Android debug APK
    needs: build-web-studio
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download studio distribution
        uses: actions/download-artifact@v4
        with:
          name: MidiAble-studio-web
          path: android-wrapper/app/src/main/assets/studio

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MidiAble-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
