name: OpenDAW Offline Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/midiable-build.yml"
      - "packages/app/studio/src/main.ts"
      - "packages/app/studio/src/midiable-mobile.sass"
      - "packages/app/studio/src/boot.ts"
      - "packages/app/studio/src/service/StudioNavigation.ts"
      - "packages/app/studio/src/ui/Footer.tsx"
      - "packages/app/studio/src/ui/App.tsx"
      - "packages/app/studio/src/ui/TouchDock.tsx"
      - "packages/app/studio/src/ui/dashboard/Dashboard.tsx"
      - "packages/app/studio/src/ui/workspace/Default.ts"
      - "packages/app/studio/src/ui/workspace/PanelPlaceholder.tsx"
      - "packages/app/studio/src/ui/workspace/PanelResizer.tsx"
      - "packages/app/studio/src/ui/workspace/PanelResizer.tsx"
      - "packages/app/studio/src/ui/browse/AndroidSampleBridge.ts"
      - "packages/app/studio/src/ui/browse/SampleBrowser.tsx"
      - "packages/app/studio/src/ui/browse/SampleView.tsx"
      - "packages/app/studio/src/ui/browse/SampleSelection.ts"
      - "packages/app/studio/src/ui/browse/PresetService.ts"
      - "packages/app/studio/src/ui/browse/SoundfontBrowser.tsx"
      - "packages/app/studio/src/ui/browse/AndroidSampleBridge.ts"
      - "packages/app/studio/src/ui/workspace/PanelResizer.sass"
      - "packages/app/studio/src/ui/workspace/WorkspacePage.sass"
      - "packages/app/studio/src/ui/workspace/PanelPlaceholder.sass"
      - "packages/app/studio/src/ui/piano-panel/PianoModePanel.sass"
      - "packages/app/studio/src/ui/timeline/Timeline.sass"
      - "packages/app/studio/src/ui/header/Header.tsx"
      - "packages/lib/dom/src/files.ts"
      - "scripts/generate-offline-samples.py"
      - "packages/app/studio/index.html"
      - "packages/app/studio/public/favicon.svg"
      - "android-wrapper/**"

permissions:
  contents: read

jobs:
  build-web-studio:
    name: Build offline studio and WASM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust nightly with WASM target and source
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Generate bundled original offline samples
        run: python3 scripts/generate-offline-samples.py packages/app/studio/public/offline-samples

      - name: Build WASM engine and devices
        run: npm run build-wasm

      - name: Build studio and internal workspace dependencies
        env:
          CI: "false"
        run: npx turbo run build --filter=@opendaw/app-studio... --output-logs=full

      - name: Verify offline studio distribution
        run: |
          set -eu
          test -s packages/app/studio/dist/index.html
          test -s packages/app/studio/dist/build-info.json
          test -s packages/app/studio/dist/offline-samples/index.json
          test -s packages/app/studio/dist/offline-samples/kick.wav
          test -s packages/app/studio/dist/offline-samples/snare.wav
          test -s packages/app/studio/dist/offline-samples/hihat.wav
          find packages/app/studio/dist -type f -name '*.wasm' | grep -q .
          echo "Offline asset count: $(find packages/app/studio/dist -type f | wc -l)"
          echo "Bundled WASM modules:"
          find packages/app/studio/dist -type f -name '*.wasm' | sort

      - name: Upload bundled studio distribution
        uses: actions/upload-artifact@v4
        with:
          name: OpenDAW-studio-offline-assets
          path: packages/app/studio/dist/
          if-no-files-found: error
          retention-days: 7

  build-android-apk:
    name: Package OpenDAW Android APK
    needs: build-web-studio
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundled studio distribution
        uses: actions/download-artifact@v4
        with:
          name: OpenDAW-studio-offline-assets
          path: android-wrapper/app/src/main/assets/studio

      - name: Verify packaged offline engine and branding
        run: |
          set -eu
          test -s android-wrapper/app/src/main/assets/studio/index.html
          test -s android-wrapper/app/src/main/assets/studio/build-info.json
          test -s android-wrapper/app/src/main/assets/studio/offline-samples/index.json
          test -s android-wrapper/app/src/main/assets/studio/offline-samples/kick.wav
          find android-wrapper/app/src/main/assets/studio -type f -name '*.wasm' | grep -q .
          grep -q 'android:label="OpenDAW"' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'OpenDAWNative' android-wrapper/app/src/main/java/com/midiable/studio/MainActivity.java
          test -s android-wrapper/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "Offline studio assets and OpenDAW branding verified."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable OpenDAW APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenDAW-offline-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
