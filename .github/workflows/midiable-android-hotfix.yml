name: MidiAble Android Hotfix Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - ".github/workflows/midiable-android-hotfix.yml"

permissions:
  contents: read
  actions: read

jobs:
  package-android-apk:
    name: Package patched Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current wrapper
        uses: actions/checkout@v4

      - name: Download last successful studio distribution
        uses: actions/download-artifact@v4
        with:
          name: MidiAble-studio-web
          path: android-wrapper/app/src/main/assets/studio
          run-id: 38065696197
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify studio assets
        run: test -s android-wrapper/app/src/main/assets/studio/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload patched debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MidiAble-isolation-hotfix-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
