name: MidiAble Android Hotfix Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MidiAble Remote Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  package-android-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Package offline Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current wrapper and source
        uses: actions/checkout@v4

      - name: Determine studio build run
        id: studio-run
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$EVENT_RUN_ID" ]; then
            echo "run_id=$EVENT_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Manual dispatch: use latest successful MidiAble Remote Build in Actions."
            echo "For manual dispatch, this workflow must be supplied a fresh artifact run id."
            exit 1
          fi

      - name: Download studio distribution from successful build
        uses: actions/download-artifact@v4
        with:
          name: MidiAble-studio-web
          path: android-wrapper/app/src/main/assets/studio
          run-id: ${{ steps.studio-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify studio assets
        run: test -s android-wrapper/app/src/main/assets/studio/index.html

      - name: Verify offline runtime assets
        run: |
          echo "Studio assets:"
          find android-wrapper/app/src/main/assets/studio -type f | wc -l
          find android-wrapper/app/src/main/assets/studio -type f \\( -name "*.wasm" -o -name "*.js" -o -name "*.html" \\) | head -30
          grep -q "crossOriginIsolated" packages/app/studio/src/main.ts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload offline debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MidiAble-offline-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
