name: StudioWave Oboe + Melvox Audio Build

on:
  workflow_dispatch:
  push:
    branches:
      - studiowave-melvox-integration

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StudioWave
        uses: actions/checkout@v4

      - name: Checkout Melvox source (pinned)
        uses: actions/checkout@v4
        with:
          repository: u4224253-dotcom/derizclone
          ref: cc5fb98aa99c536aaf022d653db9f15dac623257
          path: melvox-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare offline Melvox suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-shell/melvox
          cp -R melvox-source/. app-shell/melvox/
          sed -i "/import { startLicenseGuard } from '.\/license';/d" app-shell/melvox/src/main.ts
          sed -i "/startLicenseGuard();/d" app-shell/melvox/src/main.ts
          npm --prefix app-shell/melvox ci
          npm --prefix app-shell/melvox run build -- --base=./
          test -f app-shell/melvox/dist/index.html
          test -d app-shell/melvox/dist/assets

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Package StudioWave UI and audio assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=android-wrapper-novadaw/app/src/main/assets/novadaw
          mkdir -p "$ASSETS/assets/opendaw/fonts" "$ASSETS/assets/opendaw/ui" "$ASSETS/assets/melvox/samples/piano"
          cp app-shell/index.html "$ASSETS/index.html"
          cp app-shell/oboe-bridge.js "$ASSETS/oboe-bridge.js"
          mkdir -p "$ASSETS/melvox"
          cp -R app-shell/melvox/dist/. "$ASSETS/melvox/"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/favicon.svg -o "$ASSETS/assets/opendaw/favicon.svg"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/fonts/rubik-400.woff2 -o "$ASSETS/assets/opendaw/fonts/rubik-400.woff2"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/fonts/rubik-300.woff2 -o "$ASSETS/assets/opendaw/fonts/rubik-300.woff2"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/empty.svg -o "$ASSETS/assets/opendaw/ui/empty.svg"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/favicon-live.svg -o "$ASSETS/assets/opendaw/ui/favicon-live.svg"
          curl -fsSL https://raw.githubusercontent.com/jorgi80-droid/openDAW/main/packages/app/studio/public/grid16.svg -o "$ASSETS/assets/opendaw/ui/grid16.svg"
          cp melvox-source/public/samples/piano/*.mp3 "$ASSETS/assets/melvox/samples/piano/"
          cp melvox-source/public/samples/piano/LICENSE.txt "$ASSETS/assets/melvox/samples/piano/LICENSE.txt"

      - name: Build StudioWave APK
        working-directory: android-wrapper-novadaw
        run: gradle assembleDebug --no-daemon

      - name: Verify packaged Oboe library
        run: |
          set -euo pipefail
          APK=android-wrapper-novadaw/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstudiowave_audio.so'
          unzip -l "$APK" | grep 'assets/novadaw/melvox/index.html'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studiowave-oboe-melvox-debug-apk
          path: android-wrapper-novadaw/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
