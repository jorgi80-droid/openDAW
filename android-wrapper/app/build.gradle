plugins {
    id 'com.android.application'
}

android {
    namespace 'com.midiable.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.midiable.studio'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-offline'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0-alpha02
    implementation 'androidx.documentfile:documentfile:1.0.1''
}
