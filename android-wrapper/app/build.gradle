plugins {
    id 'com.android.application'
}

android {
    namespace 'com.midiable.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.midiable.studio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0-alpha02'
}
